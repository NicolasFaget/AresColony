# Intégration continue : tests de simulation, contrôle du menu, traductions, puis export Android.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT: ./godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Godot
        run: |
          mkdir -p godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          chmod +x "$GODOT"

      - name: Import (classes et ressources)
        run: $GODOT --headless --path . --import || true

      - name: Tests de simulation
        run: $GODOT --headless --path . -s tests/run_tests.gd

      - name: Contrôle du menu (sauvegardes)
        run: |
          set +e
          $GODOT --headless --path . -s tests/ui_menu_check.gd > ui.log 2>&1
          echo "::notice::code de sortie $?"
          set -e
          cat ui.log
          # Résumé visible dans les annotations de la CI.
          grep -vE "^ +at:|^Godot Engine|^$" ui.log | head -30 | while IFS= read -r line; do echo "::notice::$line"; done
          ! grep -q "SCRIPT ERROR" ui.log
          grep -q "continuer visible = false" ui.log
          grep -q "partie fermée = true" ui.log

      - name: Traductions
        run: python3 tools/i18n_check.py

  android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot et modèles d'export
        run: |
          mkdir -p godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot
          chmod +x "$GODOT"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          mv templates/* "$dir/"

      - name: Clé de débogage et réglages Android (SDK préinstallé sur la machine GitHub)
        run: |
          echo "SDK : $ANDROID_HOME" && ls "$ANDROID_HOME/build-tools"
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android (APK de débogage)
        run: |
          $GODOT --headless --path . --import || true
          mkdir -p build
          $GODOT --headless --path . --export-debug "Android" build/AresColony.apk
          test -s build/AresColony.apk

      - uses: actions/upload-artifact@v5
        with:
          name: AresColony-debug-apk
          path: build/AresColony.apk
          retention-days: 14
